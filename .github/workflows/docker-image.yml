name: Create and publish Docker images

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Each platform builds natively on its own runner (no QEMU emulation) and
  # pushes its image by digest only. The merge job then joins the per-platform
  # digests into one multi-arch manifest list per image.
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [snmpsim, snmptrapd]
        platform: [linux/amd64, linux/arm64]
        include:
          - target: snmpsim
            image: ''
          - target: snmptrapd
            image: -snmptrapd
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}${SUFFIX}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.image }}
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ env.PLATFORM_PAIR }},mode=max
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    strategy:
      matrix:
        target: [snmpsim, snmptrapd]
        include:
          - target: snmpsim
            image: ''
          - target: snmptrapd
            image: -snmptrapd
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # Registry references must be lowercase; github.repository may not be.
      - name: Prepare
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}${SUFFIX}" >> "$GITHUB_ENV"
        env:
          SUFFIX: ${{ matrix.image }}
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
