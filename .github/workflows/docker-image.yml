#
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ['master']

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      # 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One image per Dockerfile target. Both are built in this job, one after
      # the other, so the second build reuses the shared builder/base stages.
      - name: Extract metadata for snmpsim
        id: meta-snmpsim
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Extract metadata for snmptrapd
        id: meta-snmptrapd
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-snmptrapd
      - name: Build and push snmpsim
        uses: docker/build-push-action@v5
        with:
          context: .
          target: snmpsim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-snmpsim.outputs.tags }}
          labels: ${{ steps.meta-snmpsim.outputs.labels }}
          cache-from: type=gha
      - name: Build and push snmptrapd
        uses: docker/build-push-action@v5
        with:
          context: .
          target: snmptrapd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-snmptrapd.outputs.tags }}
          labels: ${{ steps.meta-snmptrapd.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
