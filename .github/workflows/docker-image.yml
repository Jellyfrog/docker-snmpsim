name: Create and publish Docker images

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Docker's reusable builder runs each platform natively on its own runner
  # (no QEMU), pushes by digest and merges them into a multi-arch manifest.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: snmpsim
            image: ghcr.io/${{ github.repository }}
          - target: snmptrapd
            image: ghcr.io/${{ github.repository }}-snmptrapd
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write # to push to ghcr.io
      id-token: write # for signing attestations and cache entries with GitHub OIDC
    with:
      output: image
      push: true
      target: ${{ matrix.target }}
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-26.04
        linux/arm64=ubuntu-26.04-arm
      cache: true
      cache-mode: max
      job-name-prefix: ${{ matrix.target }}
      meta-images: ${{ matrix.image }}
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
